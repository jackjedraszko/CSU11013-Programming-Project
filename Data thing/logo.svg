<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">

<!-- Background -->
<rect width="1200" height="900" fill="#0B132B"></rect>

<!-- Decorative circle -->
<circle cx="600" cy="340" r="240" fill="none" stroke="#5BC0EB" stroke-width="6"></circle>

<!-- Flight path -->
<path d="M320 460 Q600 140 880 300" stroke="#5BC0EB" stroke-width="6" fill="none" stroke-dasharray="12 10"></path>

<!-- Data nodes -->
<circle cx="320" cy="460" r="9" fill="#5BC0EB"></circle>
<circle cx="600" cy="140" r="9" fill="#5BC0EB"></circle>
<circle cx="880" cy="300" r="9" fill="#5BC0EB"></circle>

<!-- Airplane -->
<polygon points="600,120 625,180 600,170 575,180" fill="#FFFFFF"></polygon>

<!-- Data cross lines -->
<line x1="460" y1="280" x2="740" y2="400" stroke="#1C2541" stroke-width="3"></line>
<line x1="460" y1="400" x2="740" y2="280" stroke="#1C2541" stroke-width="3"></line>

<!-- Main Title -->
<text x="600" y="690" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="100" font-weight="700" fill="#FFFFFF">
US FLIGHT DATA
</text>

<!-- Subtitle -->
<text x="600" y="750" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="36" letter-spacing="6" fill="#5BC0EB">
AVIATION ANALYTICS
</text>

</svg>